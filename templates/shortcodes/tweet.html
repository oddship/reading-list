<figure class="card" data-x-embed data-tweet-id="{{ id }}" data-tweet-url="{{ url }}">
  <div data-x-placeholder>
    <p><strong>X / Twitter post</strong></p>
    <p>X embeds can let X track your visit. This choice is remembered in this browser.</p>
    <button type="button" class="outline" data-x-consent-button>Show embedded post</button>
  </div>
  <figcaption><a href="{{ url }}">Open post on X</a></figcaption>
</figure>
