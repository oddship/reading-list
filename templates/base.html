<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  {% block social_meta %}
    <meta name="description" content="{{ config.description }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.title }}">
    <meta property="og:title" content="{{ config.title }}">
    <meta property="og:description" content="{{ config.description }}">
    <meta property="og:url" content="{{ config.base_url | safe }}">
    <meta property="og:image" content="{{ get_url(path='social-card.png') }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ config.title }}">
    <meta name="twitter:description" content="{{ config.description }}">
    <meta name="twitter:image" content="{{ get_url(path='social-card.png') }}">
  {% endblock social_meta %}
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }} RSS" href="{{ get_url(path='rss.xml') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }} Atom" href="{{ get_url(path='atom.xml') }}">
  <link rel="stylesheet" href="{{ get_url(path='vendor/oatbase/oatbase.min.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='vendor/oatbase/aspect-ratio.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
  <script>
    // Apply a saved appearance before paint; Oatbase owns subsequent changes.
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      }
    } catch (_) {}
  </script>
  <script src="{{ get_url(path='vendor/oatbase/theme-switcher.js') }}" defer></script>
  <script src="{{ get_url(path='embeds.js') }}" defer></script>
</head>
<body>
  <div class="site-shell">
    <header class="hstack justify-between mb-6">
      <a href="{{ get_url(path='@/_index.md') }}"><strong>{{ config.title }}</strong></a>
      <nav class="hstack" aria-label="Primary navigation">
        <a href="{{ get_url(path='@/notes/_index.md') }}">Notes</a>
        <a href="{{ get_url(path='@/digests/_index.md') }}">Digests</a>
        <a href="{{ get_url(path='@/about/index.md') }}">About</a>
        <a href="{{ get_url(path='tags') }}">Tags</a>
        <a href="{{ get_url(path='rss.xml') }}">RSS</a>
        <ot-theme-switcher data-storage-key="theme">
          <button type="button" class="outline" aria-label="Change color theme">System</button>
        </ot-theme-switcher>
      </nav>
    </header>

    <main id="main-content" class="vstack gap-6">
      {% block content %}{% endblock content %}
    </main>

    <footer class="mt-8">
      <hr>
      <p><small>Built with <a href="https://www.getzola.org/">Zola</a> and <a href="https://github.com/oddship/oatbase">Oatbase</a>. <a href="https://github.com/oddship/reading-list">Source</a>. <a href="https://oddship.net/">oddship.net</a>. <a href="https://rohanverma.net/">rohanverma.net</a>.</small></p>
    </footer>
  </div>
</body>
</html>
